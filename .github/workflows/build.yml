name: Build

on:
  push:
    branches:
      - '**'
  release:
    types: [published]
    
permissions:
  contents: write

env:
  BUILD_TYPE: Release
  EM_VERSION: 2.0.18
  EM_CACHE_FOLDER: 'emsdk-cache'

jobs:

  build:

    name: ${{matrix.name}}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
            release-suffix: LIN64
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
            apt-packages: libsdl2-dev libsdl2-image-dev libsdl2-net-dev python3-setuptools

          - os: ubuntu-22.04
            name: STM32
            release-suffix: STM32
            cmake-args: -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/32blit.toolchain
            apt-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools

          - os: ubuntu-22.04
            name: Emscripten
            release-suffix: WEB
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
            cmake-prefix: emcmake
            apt-packages: python3-setuptools

          - os: ubuntu-22.04
            name: VGC
            release-suffix: VGC
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk -DPICO_BOARD=chilichip_vgc -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/pico2.toolchain
            apt-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools

          - os: ubuntu-22.04
            name: VGC (.blit)
            release-suffix: VGC-BLIT
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk -DPICO_BOARD=chilichip_vgc -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/32blit-sdk/pico2.toolchain -DBLIT_EXECUTABLE_PICO_BLIT=1
            apt-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib python3-setuptools

          - os: macos-latest
            name: macOS
            release-suffix: MACOS
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk
            brew-packages: sdl2 sdl2_image sdl2_net pipx

          - os: windows-latest
            name: Visual Studio
            release-suffix: WIN64
            cmake-args: -D32BLIT_DIR=$GITHUB_WORKSPACE/32blit-sdk -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    runs-on: ${{matrix.os}}

    env:
      RELEASE_FILE: ${{github.event.repository.name}}-${{github.event.release.tag_name}}-${{matrix.release-suffix}}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main

      - name: Checkout 32Blit API
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chili-chip/32blit-sdk
          path: 32blit-sdk

      - name: Checkout Pico SDK
        if: startsWith(matrix.name, 'VGC')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chili-chip/pico-sdk
          path: pico-sdk
          submodules: true

      - name: Checkout Pico Extras
        if: startsWith(matrix.name, 'VGC')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chili-chip/pico-extras
          path: pico-extras

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install ${{matrix.apt-packages}}
          pip3 install 32blit "bitstring<5"

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install ${{matrix.brew-packages}}
          pipx install 32blit
          pipx inject --force 32blit "bitstring<5"

      - name: Install Windows deps
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install 32blit "bitstring<5"

      - name: Setup Emscripten cache
        if: matrix.name == 'Emscripten'
        id: cache-system-libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{env.EM_CACHE_FOLDER}}
          key: ${{env.EM_VERSION}}-${{runner.os}}

      - name: Setup Emscripten
        if: matrix.name == 'Emscripten'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{env.EM_VERSION}}
          actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

      - name: Pre-build Emscripten ports
        if: matrix.name == 'Emscripten'
        run: embuilder.py build sdl2 sdl2-image-jpg sdl2-net

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/main/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/main/build
        run: ${{matrix.cmake-prefix}} cmake $GITHUB_WORKSPACE/main -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCPACK_PACKAGE_FILE_NAME=${{env.RELEASE_FILE}} ${{matrix.cmake-args}}

      - name: Build
        working-directory: ${{runner.workspace}}/main/build
        shell: bash
        run: |
          cmake --build . --config $BUILD_TYPE -j 2

      - name: Check the .blit is for the VGC Zero
        if: matrix.name == 'VGC (.blit)'
        shell: bash
        working-directory: ${{runner.workspace}}/main/build
        run: |
          python3 - *.blit <<'PY'
          import struct, sys
          # BlitGameHeader: magic, render, tick, init, end, then the uint16 device id
          for path in sys.argv[1:]:
              magic, device_id = struct.unpack_from('<4s16xH', open(path, 'rb').read())
              if magic != b'BLIT' or device_id != 3:
                  sys.exit(f'{path}: not an RP2350 .blit (magic {magic}, device {device_id}), the console would reject it')
              print(f'{path}: RP2350 .blit')
          PY

      - name: Upload console build
        if: startsWith(matrix.name, 'VGC')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{matrix.name == 'VGC' && 'game-uf2' || 'game-blit'}}
          path: ${{runner.workspace}}/main/build/*.${{matrix.name == 'VGC' && 'uf2' || 'blit'}}
          if-no-files-found: error

      - name: Package Release
        if: github.event_name == 'release' && matrix.release-suffix != ''
        shell: bash
        working-directory: ${{runner.workspace}}/main/build
        run: |
          cmake --build . --config $BUILD_TYPE --target package

      - name: Upload tar
        if: github.event_name == 'release' && matrix.release-suffix != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{runner.workspace}}/main/build/${{env.RELEASE_FILE}}.tar.gz

      - name: Upload zip
        if: github.event_name == 'release' && matrix.release-suffix != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{runner.workspace}}/main/build/${{env.RELEASE_FILE}}.zip

      - name: Upload .blit
        if: github.event_name == 'release' && matrix.name == 'VGC (.blit)'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{runner.workspace}}/main/build/*.blit

      - name: Rename HTML to index.html
        if: matrix.name == 'Emscripten' && github.ref == 'refs/heads/main'
        run: |
          cd ${{runner.workspace}}/main/build
          original_html=$(ls *.html | head -n 1)
          mv "$original_html" index.html

      - name: Upload Emscripten build artifact
        if: matrix.name == 'Emscripten' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emscripten-build
          path: ${{runner.workspace}}/main/build

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Download Emscripten build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emscripten-build
          path: web-build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-build

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
